{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Payments</h2>
<ul class="divide-y divide-stone-200 bg-white rounded-lg border border-stone-200">
    {% for payment in payments %}
    <li>
        <a href="{% url 'payment_detail' payment.pk %}" class="block px-4 py-3 active:bg-stone-100">
            <p class="font-medium">{{ payment.amount }} {{ payment.currency }}</p>
            <p class="text-sm text-stone-500">{{ payment.status|default:"—" }}</p>
        </a>
    </li>
    {% empty %}
    <li class="px-4 py-3 text-stone-500">No payments yet.</li>
    {% endfor %}
</ul>
{% endblock %}
