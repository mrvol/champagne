<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Champagne{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function b64urlToBuffer(b64url) {
            const pad = '='.repeat((4 - b64url.length % 4) % 4);
            const b64 = (b64url + pad).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(b64);
            const buf = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
            return buf.buffer;
        }
        function bufferToB64url(buf) {
            const bytes = new Uint8Array(buf);
            let str = '';
            for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-900">
    <header class="sticky top-0 bg-white border-b-2 border-amber-600 px-4 py-3 flex items-center justify-between">
        <a href="/" class="text-lg font-semibold text-green-900">Champagne</a>
        <nav class="text-sm space-x-3">
            {% if user.is_authenticated %}
            <a href="{% url 'cart_detail' %}" class="text-stone-600">Cart</a>
            <a href="{% url 'logout' %}" class="text-stone-600">Logout</a>
            {% else %}
            <a href="{% url 'login' %}" class="text-stone-600">Sign in</a>
            <a href="{% url 'register' %}" class="text-stone-600">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main class="p-4 pb-20 max-w-md mx-auto">
        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <p class="text-sm rounded-md px-3 py-2 {% if message.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-amber-50 text-amber-700{% endif %}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-stone-200 flex justify-around max-w-md mx-auto">
        <a href="{% url 'home' %}" class="flex-1 text-center text-xs text-stone-600 py-3">Home</a>
        <a href="{% url 'good_list' %}" class="flex-1 text-center text-xs text-stone-600 py-3">Goods</a>
        {% if user.is_authenticated %}
        <a href="{% url 'cart_detail' %}" class="flex-1 text-center text-xs text-stone-600 py-3">Cart</a>
        <a href="{% url 'order_list' %}" class="flex-1 text-center text-xs text-stone-600 py-3">Orders</a>
        {% else %}
        <a href="{% url 'login' %}" class="flex-1 text-center text-xs text-stone-600 py-3">Sign in</a>
        {% endif %}
    </nav>
</body>
</html>
