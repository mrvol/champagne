<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Champagne{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50 text-neutral-900">
    <header class="sticky top-0 bg-white border-b border-neutral-200 px-4 py-3">
        <a href="/" class="text-lg font-semibold">Champagne</a>
    </header>
    <main class="p-4 max-w-md mx-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
