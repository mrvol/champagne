{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Stock</h2>
<ul class="divide-y divide-stone-200 bg-white rounded-lg border border-stone-200">
    {% for item in stock %}
    <li>
        <a href="{% url 'stock_detail' item.pk %}" class="block px-4 py-3 active:bg-stone-100">
            <p class="font-medium">{{ item.good }}</p>
            <p class="text-sm text-stone-500">{{ item.warehouse }} · qty {{ item.quantity }}</p>
        </a>
    </li>
    {% empty %}
    <li class="px-4 py-3 text-stone-500">No stock yet.</li>
    {% endfor %}
</ul>
{% endblock %}
