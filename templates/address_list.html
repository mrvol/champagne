{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Addresses</h2>
<ul class="divide-y divide-stone-200 bg-white rounded-lg border border-stone-200">
    {% for address in addresses %}
    <li>
        <a href="{% url 'address_detail' address.pk %}" class="block px-4 py-3 active:bg-stone-100">
            <p class="font-medium">{{ address.line1|default:"—" }}</p>
            <p class="text-sm text-stone-500">{{ address.city|default:"—" }}</p>
        </a>
    </li>
    {% empty %}
    <li class="px-4 py-3 text-stone-500">No addresses yet.</li>
    {% endfor %}
</ul>
{% endblock %}
