{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Stock #{{ item.pk }}</h2>
<dl class="bg-white rounded-lg border border-neutral-200 divide-y divide-neutral-200 text-sm">
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Warehouse</dt><dd>{{ item.warehouse }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Good</dt><dd>{{ item.good }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Quantity</dt><dd>{{ item.quantity }}</dd></div>
</dl>
<a href="{% url 'stock_list' %}" class="inline-block mt-4 text-sm text-neutral-500">&larr; Back</a>
{% endblock %}
