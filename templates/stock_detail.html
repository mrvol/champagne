{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h2 class="font-serif text-2xl font-semibold text-green-900 mb-6">{% blocktrans with pk=item.pk %}Stock #{{ pk }}{% endblocktrans %}</h2>
<div class="grid grid-cols-2 gap-x-6 gap-y-5 bg-white rounded-xl border border-stone-200 p-6 text-sm">
    <div>
        <p class="text-xs uppercase tracking-wide text-stone-500 mb-1">{% trans "Warehouse" %}</p>
        <p class="font-medium">{{ item.warehouse }}</p>
    </div>
    <div>
        <p class="text-xs uppercase tracking-wide text-stone-500 mb-1">{% trans "Good" %}</p>
        <p class="font-medium">{{ item.good }}</p>
    </div>
    <div>
        <p class="text-xs uppercase tracking-wide text-stone-500 mb-1">{% trans "Quantity" %}</p>
        <p class="font-medium">{{ item.quantity }}</p>
    </div>
</div>
<a href="{% url 'stock_list' %}" class="inline-block mt-6 text-sm text-stone-500">&larr; {% trans "Back" %}</a>
{% endblock %}
