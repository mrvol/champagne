{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-4">Sign up</h2>
{% if error %}<p class="text-sm text-red-600 mb-3">{{ error }}</p>{% endif %}
<form method="post" class="bg-white rounded-lg border border-stone-200 p-4 space-y-3">
    {% csrf_token %}
    <div>
        <label class="block text-sm text-stone-500 mb-1">Name</label>
        <input type="text" name="name" required class="w-full border border-stone-300 rounded-md p-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-stone-500 mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-stone-300 rounded-md p-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-stone-500 mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-stone-300 rounded-md p-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-stone-500 mb-1">Date of birth</label>
        <input type="date" name="birthday" required class="w-full border border-stone-300 rounded-md p-2 text-sm">
    </div>
    <button type="submit" class="w-full bg-green-900 text-white rounded-md py-2 text-sm">Create account</button>
</form>
<p class="text-sm text-stone-500 mt-4">Already have an account? <a href="{% url 'login' %}" class="text-green-800">Sign in</a></p>
{% endblock %}
