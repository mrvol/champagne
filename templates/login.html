{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-4">Sign in</h2>
{% if error %}<p class="text-sm text-red-600 mb-3">{{ error }}</p>{% endif %}
<form method="post" class="bg-white rounded-lg border border-stone-200 p-4 space-y-3">
    {% csrf_token %}
    <div>
        <label class="block text-sm text-stone-500 mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-stone-300 rounded-md p-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-stone-500 mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-stone-300 rounded-md p-2 text-sm">
    </div>
    <button type="submit" class="w-full bg-green-900 text-white rounded-md py-2 text-sm">Sign in</button>
</form>

<div class="mt-4">
    <button id="passkey-login" class="w-full border border-stone-300 rounded-md py-2 text-sm">Sign in with a passkey</button>
    <p id="passkey-login-status" class="text-sm text-stone-500 mt-2"></p>
</div>
<script>
document.getElementById('passkey-login').addEventListener('click', async () => {
    const status = document.getElementById('passkey-login-status');
    const email = document.querySelector('input[name="email"]').value.trim().toLowerCase();
    if (!email) { status.textContent = 'Enter your email above first.'; return; }
    try {
        const optionsRes = await fetch('{% url "passkey_login_options" %}', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': '{{ csrf_token }}'},
            body: 'email=' + encodeURIComponent(email),
        });
        if (!optionsRes.ok) { status.textContent = 'No passkey registered for that email.'; return; }
        const options = await optionsRes.json();
        options.challenge = b64urlToBuffer(options.challenge);
        options.allowCredentials = options.allowCredentials.map(c => ({...c, id: b64urlToBuffer(c.id)}));
        const assertion = await navigator.credentials.get({ publicKey: options });
        const payload = {
            id: assertion.id,
            response: {
                clientDataJSON: bufferToB64url(assertion.response.clientDataJSON),
                authenticatorData: bufferToB64url(assertion.response.authenticatorData),
                signature: bufferToB64url(assertion.response.signature),
            },
        };
        const verifyRes = await fetch('{% url "passkey_login_verify" %}', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify(payload),
        });
        if (verifyRes.ok) {
            window.location.href = '/';
        } else {
            status.textContent = 'Passkey sign-in failed.';
        }
    } catch (err) {
        status.textContent = 'Passkey sign-in was cancelled or failed.';
    }
});
</script>
<p class="text-sm text-stone-500 mt-4">No account? <a href="{% url 'register' %}" class="text-green-800">Sign up</a></p>
{% endblock %}
