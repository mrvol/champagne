{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">{{ user.username }}</h2>
<dl class="bg-white rounded-lg border border-neutral-200 divide-y divide-neutral-200 text-sm">
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Email</dt><dd>{{ user.email }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Phone</dt><dd>{{ user.phone|default:"—" }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Country</dt><dd>{{ user.country|default:"—" }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">Roles</dt><dd>{{ user.roles }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-neutral-500">KYC status</dt><dd>{{ user.kyc_status|default:"—" }}</dd></div>
</dl>
<a href="{% url 'user_list' %}" class="inline-block mt-4 text-sm text-neutral-500">&larr; Back</a>
{% endblock %}
