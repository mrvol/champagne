{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Payment #{{ payment.pk }}</h2>
<dl class="bg-white rounded-lg border border-stone-200 divide-y divide-stone-200 text-sm">
    <div class="px-4 py-3 flex justify-between"><dt class="text-stone-500">Order</dt><dd>{{ payment.order }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-stone-500">Payer</dt><dd>{{ payment.payer }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-stone-500">Amount</dt><dd>{{ payment.amount }} {{ payment.currency }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-stone-500">Status</dt><dd>{{ payment.status|default:"—" }}</dd></div>
    <div class="px-4 py-3 flex justify-between"><dt class="text-stone-500">Provider</dt><dd>{{ payment.provider|default:"—" }}</dd></div>
</dl>
<a href="{% url 'payment_list' %}" class="inline-block mt-4 text-sm text-stone-500">&larr; Back</a>
{% endblock %}
