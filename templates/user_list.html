{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Users</h2>
<ul class="divide-y divide-stone-200 bg-white rounded-lg border border-stone-200">
    {% for user in users %}
    <li>
        <a href="{% url 'user_detail' user.pk %}" class="block px-4 py-3 active:bg-stone-100">
            <p class="font-medium">{{ user.username }}</p>
            <p class="text-sm text-stone-500">{{ user.email }}</p>
        </a>
    </li>
    {% empty %}
    <li class="px-4 py-3 text-stone-500">No users yet.</li>
    {% endfor %}
</ul>
{% endblock %}
