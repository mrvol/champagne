{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h2 class="font-serif text-2xl font-semibold text-green-900 mb-5">{% trans "Users" %}</h2>
<ul class="space-y-3">
    {% for user in users %}
    <li>
        <a href="{% url 'user_detail' user.pk %}" class="block bg-white rounded-xl border border-stone-200 px-4 py-3.5 transition duration-200 ease-out hover:border-stone-300 hover:shadow-md">
            <p class="font-medium">{{ user.username }}</p>
            <p class="text-sm text-stone-500">{{ user.email }}</p>
        </a>
    </li>
    {% empty %}
    <li class="text-center py-16 text-stone-500">{% trans "No users yet." %}</li>
    {% endfor %}
</ul>
{% endblock %}
