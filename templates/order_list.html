{% extends "base.html" %}
{% block content %}
<h2 class="text-base font-medium mb-3">Orders</h2>
<ul class="divide-y divide-stone-200 bg-white rounded-lg border border-stone-200">
    {% for order in orders %}
    <li>
        <a href="{% url 'order_detail' order.pk %}" class="block px-4 py-3 active:bg-stone-100">
            <p class="font-medium">Order #{{ order.pk }}</p>
            <p class="text-sm text-stone-500">{{ order.status|default:"—" }} · {{ order.total_amount }} {{ order.currency }}</p>
        </a>
    </li>
    {% empty %}
    <li class="px-4 py-3 text-stone-500">No orders yet.</li>
    {% endfor %}
</ul>
{% endblock %}
