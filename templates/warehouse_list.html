{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h2 class="font-serif text-2xl font-semibold text-green-900 mb-5">{% trans "Warehouses" %}</h2>
<ul class="space-y-3">
    {% for warehouse in warehouses %}
    <li>
        <a href="{% url 'warehouse_detail' warehouse.pk %}" class="block bg-white rounded-xl border border-stone-200 px-4 py-3.5 transition duration-200 ease-out hover:border-stone-300 hover:shadow-md">
            <p class="font-medium">{{ warehouse.name|default:"—" }}</p>
            <p class="text-sm text-stone-500">{{ warehouse.city|default:"—" }}</p>
        </a>
    </li>
    {% empty %}
    <li class="text-center py-16 text-stone-500">{% trans "No warehouses yet." %}</li>
    {% endfor %}
</ul>
{% endblock %}
