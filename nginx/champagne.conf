# nginx config for Voilà Champagne, meant to run on the HOST (not inside Docker).
# It reverse-proxies to the app container (docker-compose publishes it on
# 127.0.0.1:8989 - see docker-compose.yml) and serves static/ and media/
# directly from the same host-mounted volumes the container writes into,
# instead of proxying that traffic through Django.
#
# Install:
#   sudo cp nginx/champagne.conf /etc/nginx/sites-available/champagne.conf
#   sudo ln -s /etc/nginx/sites-available/champagne.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before that: replace every /path/to/champagne below with the actual path to
# this repo on the host (the same directory docker-compose.yml lives in), and
# set server_name to your real domain.
#
# This is HTTP-only. For HTTPS, the simplest path is Certbot's nginx plugin
# (`sudo certbot --nginx -d voilachampagne.com`), which rewrites this file to
# add the certificate, key, and an HTTP->HTTPS redirect automatically.

upstream champagne_app {
    server 127.0.0.1:8989;
}

server {
    listen 80;
    listen [::]:80;
    server_name voilachampagne.com www.voilachampagne.com;

    # Product photo uploads (staff quick-edit widgets) can be a few MB;
    # nginx's 1M default would reject them before Django ever sees them.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /path/to/champagne/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /path/to/champagne/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://champagne_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
